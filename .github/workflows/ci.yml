name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: 앱 (Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 버전은 package.json 의 packageManager 필드에서 읽습니다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-datasets
      - run: pnpm build-lines
      - run: pnpm verify-data
      - run: pnpm build-transfer-data
      - run: pnpm verify-transfer-data
      - run: pnpm verify-routes
      - run: pnpm typecheck
      - run: pnpm lint
      - name: 생성 파일이 커밋된 것과 같은지
        run: git diff --exit-code -- src/data
      - name: 번들 스모크 (iOS)
        run: pnpm exec expo export --platform ios --output-dir /tmp/export-ios

  backend:
    name: 백엔드 (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Jinobald.Subway.slnx
      - run: dotnet build backend/Jinobald.Subway.slnx --configuration Release --no-restore
      - run: dotnet test backend/Jinobald.Subway.slnx --configuration Release --no-build --logger trx
      - name: 실제 데이터셋 적재 스모크
        run: dotnet run --project backend/src/Jinobald.Subway.Ingest --configuration Release --no-build -- import --raw scripts/data/raw --db /tmp/subway.db
      - name: 시뮬레이터 스냅샷
        run: dotnet run --project backend/src/Jinobald.Subway.Ingest --configuration Release --no-build -- simulate --line 2 --at 08:30 --db /tmp/subway.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/**/*'
